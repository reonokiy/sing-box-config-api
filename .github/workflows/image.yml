name: Image
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: python3 -m unittest discover -s test -p agent_test.py
      - run: docker compose -p registry-test -f compose.test.yaml up -d --build
      - run: node test/docker-smoke.mjs
      - run: docker run --rm --network host -v "$PWD:/work" -w /work mcr.microsoft.com/playwright:v1.63.0-noble node test/browser-smoke.mjs
      - if: always()
        run: docker compose -p registry-test -f compose.test.yaml down --volumes

  image:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/reonokiy/sing-box-config-api:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
